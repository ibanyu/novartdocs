    OpenAdCloneAnalyzeBody:
      type: object
      description: 视频复刻 — 分析源视频并生成 prompt。
      properties:
        video_url:
          type: string
          description: 源视频 URL
        clip_start:
          type: integer
          format: int32
          minimum: 0
          description: 圈选起始时间（秒，非负）
        clip_end:
          type: integer
          format: int32
          minimum: 0
          description: >-
            圈选结束时间（秒）；须 clip_end > clip_start，且 clip_end - clip_start ≤ 12（片段最长
            12 秒）
    OpenAdCloneGenerateBody:
      type: object
      description: 视频复刻 — 提交生成任务；响应含异步任务 ID（`workspace_id`）。
      properties:
        prompt:
          type: string
          description: prompt（可在 Analyze 返回基础上修改）
        video_url:
          type: string
          description: 源视频片段 URL（Analyze 返回的 video_segment_url）
        concurrent:
          type: integer
          format: int32
          minimum: 1
          description: 并发生成数量（≥1）
        callback_id:
          type: string
          description: 自定义追踪 ID，webhook URL 后台配置
    OpenVideoGenerateBody:
      type: object
      description: >
        视频生成。文生视频时 `start_frame` / `end_frame` / `reference_*` 留空；

        图生视频时通过 `start_frame`（可叠加 `end_frame`）控制首尾帧；多参考媒体由 `reference_images` /
        `reference_videos` / `reference_audios` 携带。


        **各模型规则**（取值集与上限按模型而定，服务端校验为准）：


        | model | duration | resolution | ratio | start/end_frame |
        reference_images | reference_videos | reference_audios | 备注 |

        |---|---|---|---|---|---|---|---|---|

        | `veo-3.1` | 4/6/8（默认 8） | 720p / 1080p / 4k | 16:9 / 9:16 | ≤2 | 无上限 |
        — | — | frame 与 reference 互斥 |

        | `kling-3.0` | 3~15（默认 8） | — | — | ≤2 | ≤1 | — | — | |

        | `grok` | 6/10（默认 6） | — | — | 不支持 | ≤1（作为首帧使用） | — | — | |

        | `seedance-2.0` | 4~15（默认 15） | 720p / 1080p | — | ≤2 | ≤9 | ≤3 | ≤3 |
        frame 与 reference 互斥；audio 需配 image/video |

        | `happyhorse-1.0` | 3~15（默认 5） | 720p / 1080p | 16:9 / 9:16 / 1:1 / 4:3
        / 3:4 | ≤1 | ≤9 | ≤1（有视频时图片改限 ≤5） | — | frame 与 reference 互斥 |
      properties:
        prompt:
          type: string
        model:
          type: string
          example: veo-3.1
          enum:
            - veo-3.1
            - kling-3.0
            - grok
            - seedance-2.0
            - happyhorse-1.0
          description: 模型短名称，省略时走服务端默认。
        ratio:
          type: string
          example: '16:9'
          description: 取值集因 model 而异，详见请求体表格。
          enum:
            - '16:9'
            - '9:16'
            - '1:1'
            - '4:3'
            - '3:4'
        duration:
          type: integer
          format: int32
          description: 视频时长（秒）。取值集 / 范围因 model 而异，详见请求体表格。
        resolution:
          type: string
          example: 1080p
          description: 仅部分模型支持；取值集因 model 而异，详见请求体表格。
          enum:
            - 720p
            - 1080p
            - 4k
        start_frame:
          type: string
          description: 首帧图片 URL
        end_frame:
          type: string
          description: 尾帧图片 URL
        reference_images:
          type: array
          items:
            type: string
        reference_videos:
          type: array
          items:
            type: string
        reference_audios:
          type: array
          items:
            type: string
        callback_id:
          type: string
          description: 自定义追踪 ID，webhook URL 后台配置
        idempotency_key:
          type: string
          description: 幂等键，相同 key 重复请求复用同一任务
    OpenVideoExtendBody:
      type: object
      description: >
        视频延长。源视频二选一：`workspace_id`（内部）或 `video_url`（外部）；同时传 / 同时空均报错。

        `duration` 为增量秒数。


        **仅支持 `seedance-2.0` 模型基座**，不开放其他模型。`duration` 取值范围 4~15（默认
        15），`resolution` 取 `720p` / `1080p`。
      properties:
        workspace_id:
          type: string
        video_url:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          format: int32
          minimum: 4
          maximum: 15
          description: 在源视频末尾追加的秒数；范围 4~15，默认 15。
        model:
          type: string
          enum:
            - seedance-2.0
          default: seedance-2.0
          description: 仅支持 `seedance-2.0`。
        ratio:
          type: string
        resolution:
          type: string
          enum:
            - 720p
            - 1080p
        callback_id:
          type: string
          description: 自定义追踪 ID，webhook URL 后台配置
        idempotency_key:
          type: string
    OpenVideoEditBody:
      type: object
      description: |
        视频编辑。源视频二选一：`workspace_id` 或 `video_url`；同时传 / 同时空均报错。
        `mask_url` 可选；非空时为局部编辑掩码（模型支持度以服务端为准）。

        **仅支持 `seedance-2.0` 模型基座**，不开放其他模型。`resolution` 取 `720p` / `1080p`。
      properties:
        workspace_id:
          type: string
        video_url:
          type: string
        prompt:
          type: string
        mask_url:
          type: string
        reference_images:
          type: array
          items:
            type: string
        model:
          type: string
          enum:
            - seedance-2.0
          default: seedance-2.0
          description: 仅支持 `seedance-2.0`。
        ratio:
          type: string
        resolution:
          type: string
          enum:
            - 720p
            - 1080p
        callback_id:
          type: string
          description: 自定义追踪 ID，webhook URL 后台配置
        idempotency_key:
          type: string
