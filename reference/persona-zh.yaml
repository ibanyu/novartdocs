openapi: 3.0.3
info:
  title: AdsTurbo Open API 中文
  description: >
    AdsTurbo Open API 中文文档，所有接口路径以 `/openapi/v1/` 开头。


    **Reference overview**: [API Overview / API 介绍](/reference/getting-started)


    **Base URL**：`https://www.adsturbo.ai/klian/novartapi`


    **认证**：使用 **HTTP Bearer**（RFC 6750）：请求头 `Authorization: Bearer
    <token>`，`<token>` 为在 [www.adsturbo.ai](https://www.adsturbo.ai) 控制台创建的 API
    Key。


    **请求体**：`Content-Type: application/json`


    **成功响应**：HTTP 200，JSON 格式 `{ "ret": 1, "data": { "ent": <业务数据> } }`


    **业务错误**：HTTP 200，`ret` 不为 1 时见 `msg` 字段说明。
  version: 1.0.0
servers:
  - url: https://www.adsturbo.ai/klian/novartapi
    description: API 服务地址
tags:
  - name: 图片
    description: 图片创作
  - name: 系统演员
    description: 系统演员
  - name: Persona
    description: 自定义 Persona
  - name: AdClone
    description: 视频复刻 AdClone
  - name: 视频
    description: 视频工具
  - name: 任务状态
    description: 异步任务状态
security:
  - bearerAuth: []
paths:
  /openapi/v1/img/create:
    post:
      tags:
        - 图片
      summary: 用户创作图片
      operationId: zhSaasImageCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateBody'
            examples:
              basic:
                summary: 基本示例
                value:
                  prompt: 生成一个亚洲小朋友，骑着一只泰迪狗，狗有翅膀，动漫类型
                  model: nanobanana-pro
                  image_urls: []
                  ratio: '9:16'
                  resolution: 2k
                  concurrency: 1
                  sync_mod: false
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessImageCreateEnt'
      description: '> English version: [View English docs](/reference/saasimagecreate)'
  /openapi/v1/aiactor/list:
    post:
      tags:
        - 系统演员
      summary: 系统演员列表
      operationId: zhOpenAiActorList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiActorListBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenAiActorListEnt'
      description: '> English version: [View English docs](/reference/openaiactorlist-1)'
  /openapi/v1/aiactor/say:
    post:
      tags:
        - 系统演员
      summary: 系统演员语音生成
      operationId: zhOpenAiActorSay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiActorSayBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenAiActorSayEnt'
      description: '> English version: [View English docs](/reference/openaiactorsay-1)'
  /openapi/v1/aiactor/perform:
    post:
      tags:
        - 系统演员
        - Persona
      summary: 演员演出（系统演员或 Persona）
      description: |-
        > English version: [View English docs](/reference/openaiactorperform-1)

        `actor_id` 既可为系统演员 ID，也可为自定义 Persona 的 `actor_id`，共用同一套演出参数与异步任务响应。
      operationId: zhOpenAiActorPerform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiActorPerformBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
  /openapi/v1/persona/create:
    post:
      tags:
        - Persona
      summary: 创建自定义 Persona
      operationId: zhOpenPersonaCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPersonaCreateBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenPersonaEnt'
      description: '> English version: [View English docs](/reference/openpersonacreate-1)'
  /openapi/v1/persona/delete:
    post:
      tags:
        - Persona
      summary: 删除自定义 Persona
      operationId: zhOpenPersonaDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPersonaDeleteBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenPersonaDeleteEnt'
      description: '> English version: [View English docs](/reference/openpersonadelete-1)'
  /openapi/v1/persona/list:
    post:
      tags:
        - Persona
      summary: 个人创建演员列表
      description: |-
        > English version: [View English docs](/reference/openpersonallist-1)

        分页查询当前用户创建的个人演员（Persona）列表。
      operationId: zhOpenPersonalList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPersonalListBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenPersonalListEnt'
  /openapi/v1/adclone/analyze:
    post:
      tags:
        - AdClone
      summary: 视频复刻 — 分析
      operationId: zhOpenAdCloneAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAdCloneAnalyzeBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenAdCloneAnalyzeEnt'
      description: '> English version: [View English docs](/reference/openadcloneanalyze-1)'
  /openapi/v1/adclone/generate:
    post:
      tags:
        - AdClone
      summary: 视频复刻 — 生成
      operationId: zhOpenAdCloneGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAdCloneGenerateBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openadclonegenerate-1)'
  /openapi/v1/video/generate:
    post:
      tags:
        - 视频
      summary: 视频生成（文生 / 图生 / 首尾帧 / 多参考媒体）
      description: >-
        > English version: [View English docs](/reference/openvideogenerate)


        异步任务；状态走 `/openapi/v1/work/status`，结果走 webhook。

        `model` 各能力差异以服务端注册表为准（duration / ratio / resolution / reference_*
        上限按模型而定）。
      operationId: zhOpenVideoGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoGenerateBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
  /openapi/v1/video/extend:
    post:
      tags:
        - 视频
      summary: 视频延长（在源视频末尾追加 N 秒）
      description: |-
        > English version: [View English docs](/reference/openvideoextend)

        **仅支持 `seedance-2.0` 模型基座**。
        源视频二选一：`workspace_id`（内部）或 `video_url`（外部）；同时传 / 同时空均报错。
        `duration` 为增量秒数：原 8s + duration=4 → 输出 12s。
      operationId: zhOpenVideoExtend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoExtendBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
  /openapi/v1/video/edit:
    post:
      tags:
        - 视频
      summary: 视频编辑
      description: |-
        > English version: [View English docs](/reference/openvideoedit)

        **仅支持 `seedance-2.0` 模型基座**。
        源视频二选一：`workspace_id` 或 `video_url`；同时传 / 同时空均报错。
        `mask_url` 可选；非空时为局部编辑掩码。
      operationId: zhOpenVideoEdit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoEditBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
  /openapi/v1/video/analyze:
    post:
      tags:
        - 视频
      summary: 视频拉片
      operationId: zhOpenVideoAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoAnalyzeBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideoanalyze-1)'
  /openapi/v1/video/lipsync:
    post:
      tags:
        - 视频
      summary: 视频对口型
      operationId: zhOpenVideoLipSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoLipSyncBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideolipsync-1)'
  /openapi/v1/video/inpaint:
    post:
      tags:
        - 视频
      summary: 视频水印消除
      operationId: zhOpenVideoInpaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoInpaintBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideoinpaint-1)'
  /openapi/v1/video/translate:
    post:
      tags:
        - 视频
      summary: 视频翻译
      operationId: zhOpenVideoTranslate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoTranslateBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideotranslate-1)'
  /openapi/v1/video/upscale:
    post:
      tags:
        - 视频
      summary: 视频超分
      operationId: zhOpenVideoUpscale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoUpscaleBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideoupscale-1)'
  /openapi/v1/video/character-swap:
    post:
      tags:
        - 视频
      summary: 视频换脸
      operationId: zhOpenVideoCharacterSwap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoCharacterSwapBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: >-
        > English version: [View English
        docs](/reference/openvideocharacterswap-1)
  /openapi/v1/video/motion-control:
    post:
      tags:
        - 视频
      summary: 视频动作控制
      operationId: zhOpenVideoMotionControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoMotionControlBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: >-
        > English version: [View English
        docs](/reference/openvideomotioncontrol-1)
  /openapi/v1/video/subtitle:
    post:
      tags:
        - 视频
      summary: 视频字幕
      operationId: zhOpenVideoSubtitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVideoSubtitleBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/openvideosubtitle-1)'
  /openapi/v1/work/batch-status:
    post:
      tags:
        - 任务状态
      summary: 批量查询异步任务状态
      operationId: zhOpenBatchGetWorkStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenBatchGetWorkStatusBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenBatchWorkEnt'
      description: >-
        > English version: [View English
        docs](/reference/openbatchgetworkstatus)
  /openapi/v1/work/status:
    post:
      tags:
        - 任务状态
      summary: 查询异步任务状态
      operationId: zhOpenGetWorkStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenGetWorkStatusBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenWorkEnt'
      description: '> English version: [View English docs](/reference/opengetworkstatus-1)'
  /openapi/v1/persona/status:
    post:
      tags:
        - Persona
      summary: 查询 Persona 状态
      operationId: zhOpenGetPersonaStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenGetPersonaStatusBody'
      responses:
        '200':
          description: JSON 业务响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessOpenPersonaEnt'
      description: >-
        > English version: [View English
        docs](/reference/opengetpersonastatus-1)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: >
        在 [www.adsturbo.ai](https://www.adsturbo.ai)
        控制台创建的密钥。调用时在请求头设置：`Authorization: Bearer <your_api_key>`。
  schemas:
    ImageCreateBody:
      type: object
      description: >
        图片生成或编辑。`model` 为模型短名称，省略时服务端默认 `nanobanana-pro`。

        文生图：`image_urls` 为空；图片编辑：`image_urls` 非空。


        **模式支持**：

        - 仅文生图：`grok-2-image`

        - 仅编辑：`seedream-4.5-seq`、`seedream-5.0-lite-seq`、`grok-imagine-image`

        - 文生 +
        编辑：`nanobanana-pro`、`nano-banana-2`、`nano-banana-2-fast`、`seedream-4.5`、`seedream-5.0-lite`、`gpt-image-2`


        **参数支持（按模型不同）**：

        - `ratio` 支持值因模型而异：
          - `nanobanana-pro` / `nano-banana-2` / `nano-banana-2-fast`: `16:9` / `1:1` / `9:16` / `21:9` / `2:3` / `3:2`
          - `seedream-4.5` / `seedream-4.5-seq` / `seedream-5.0-lite` / `seedream-5.0-lite-seq`: `16:9` / `1:1` / `9:16` / `2:3` / `3:2`
          - `gpt-image-2`: `1:1` / `3:2` / `2:3` / `3:4` / `4:3` / `4:5` / `5:4` / `9:16` / `16:9` / `21:9`
          - `grok-2-image` / `grok-imagine-image`: 不校验
        - `resolution` 仅以下模型支持，且取值集不同：
          - `nanobanana-pro`: `1k` / `2k` / `4k` / `8k`
          - `nano-banana-2`: `0.5k` / `1k` / `2k` / `4k`
          - `nano-banana-2-fast`: `2k` / `4k`
          - `gpt-image-2`: `1k` / `2k`
        - `quality` 仅 `gpt-image-2` 支持，取值：`low` / `medium` / `high`

        - `num_images` 仅 `seedream-4.5-seq` / `seedream-5.0-lite-seq` 支持，上限 15
      properties:
        prompt:
          type: string
          description: 文生图提示词
        image_urls:
          type: array
          items:
            type: string
          description: |
            文生图时为空数组；编辑时非空。
        model:
          type: string
          example: nanobanana-pro
          enum:
            - nanobanana-pro
            - nano-banana-2
            - nano-banana-2-fast
            - seedream-4.5
            - seedream-4.5-seq
            - seedream-5.0-lite
            - seedream-5.0-lite-seq
            - gpt-image-2
            - grok-2-image
            - grok-imagine-image
          description: 可选。默认 `nanobanana-pro`。
        ratio:
          type: string
          example: '9:16'
          description: 取值集因 model 而异，详见请求体描述。
          enum:
            - '1:1'
            - '3:2'
            - '2:3'
            - '3:4'
            - '4:3'
            - '4:5'
            - '5:4'
            - '16:9'
            - '9:16'
            - '21:9'
        resolution:
          type: string
          example: 2k
          description: >
            仅 `nanobanana-pro` / `nano-banana-2` / `nano-banana-2-fast` /
            `gpt-image-2` 支持；取值集详见请求体描述。
          enum:
            - 0.5k
            - 1k
            - 2k
            - 4k
            - 8k
        quality:
          type: string
          description: 仅 `gpt-image-2` 支持。
          enum:
            - low
            - medium
            - high
        num_images:
          type: integer
          format: int32
          minimum: 1
          maximum: 15
          description: 仅 `seedream-4.5-seq` / `seedream-5.0-lite-seq` 支持，单次输出图片数量。
        concurrency:
          type: integer
          format: int32
          description: 并发数，控制一次性输出的结果数量
          example: 1
        sync_mod:
          type: boolean
          example: false
    OpenAiActorListBody:
      type: object
      description: 系统演员列表筛选与分页；筛选项为小写，英文短语中空格用连字符。
      properties:
        gender:
          type: array
          items:
            type: string
            enum:
              - female
              - male
        age:
          type: array
          items:
            type: string
            enum:
              - senior
              - adult
              - young-adult
              - kid
        situation:
          type: array
          items:
            type: string
            enum:
              - balcony
              - beach
              - bedroom
              - car
              - coffee-shop
              - grwm
              - home
              - kitchen
              - medical
              - news-anchor
              - office
              - podcast
              - snow
              - studio
        sort_by:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        pose:
          type: array
          items:
            type: string
            enum:
              - arms-crossed
              - cross-legged
              - gesturing
              - leaning
              - leaning-forward
              - legs-crossed
              - pointing
              - reclining
              - sitting
              - standing
        shot_type:
          type: array
          items:
            type: string
            enum:
              - close-up
              - full-shot
              - long-shot
              - medium-close-up
              - medium-full-shot
              - medium-shot
        ethnicity:
          type: array
          items:
            type: string
            enum:
              - asian
              - caucasian
              - african
              - latino
        industry:
          type: array
          description: |
            按服务端行业分类过滤（如 `beauty` / `fitness` / `finance` 等）；取值集以服务端注册表为准。
          items:
            type: string
    OpenAiActorSayBody:
      type: object
      description: 系统演员语音合成请求。
      properties:
        actor_id:
          type: string
        script:
          type: string
        auto_emotion:
          type: boolean
        speed:
          type: number
          format: float
        stability:
          type: number
          format: float
        similarity:
          type: number
          format: float
    OpenAiActorPerformBody:
      type: object
      description: 演出任务请求；适用于系统演员与自定义 Persona。
      properties:
        script:
          type: string
        actor_id:
          type: string
          description: 系统演员 ID，或 Persona 的 actor_id
        auto_emotion:
          type: boolean
        speed:
          type: number
          format: float
        stability:
          type: number
          format: float
        style:
          type: number
          format: float
        speaker_boost:
          type: boolean
        similarity:
          type: number
          format: float
        callback_id:
          type: string
          description: 自定义追踪 ID，webhook URL 后台配置
    OpenPersonaCreateBody:
      type: object
